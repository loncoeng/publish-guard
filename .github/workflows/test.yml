name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called from publish. Reused rather than copied over there, so that nothing
  # gets published without having passed these.
  workflow_call:

# The token this job is given. Without this block it gets the repository's
# default, which is wider than anything here needs: nothing writes back to the
# repository, and a step that is compromised should not be able to.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # verify reads the history. With a shallow clone, the tests that
          # scan this repository itself stop meaning anything.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # No dependencies. tomllib became part of the standard library in 3.11.
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Scan this repository with itself
        run: python -m publish_guard.cli scan .
