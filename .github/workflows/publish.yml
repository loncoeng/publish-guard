# Publish to PyPI when a tag is pushed.
#
# Authenticated with OIDC rather than a token: GitHub signs a short-lived
# assertion and PyPI verifies it, so **there is no key anywhere to steal**.
#
# The Trusted Publisher configuration on PyPI's side has to agree with this
# file's name, the repository name and the environment name. Change one of them
# on its own and publishing stops working.

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The token this job is given. Without this block it gets the repository's
# default, which is wider than anything here needs: nothing writes back to the
# repository, and a step that is compromised should not be able to.
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    if: github.repository == 'loncoeng/publish-guard'
    runs-on: ubuntu-latest
    # PyPI trusts this by environment, so it is declared on this side too.
    environment: pypi
    permissions:
      # Needed to issue the OIDC assertion. Without it there is no way to
      # authenticate at all.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Check the tag against __version__ in __init__.py. Without this, a
      # v0.2.0 tag quietly publishes 0.1.0.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag=${GITHUB_REF#refs/tags/v}
          pkg=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('publish_guard/__init__.py').read_text(encoding='utf-8')).group(1))")
          if [ "$tag" != "$pkg" ]; then
            echo "The tag says v$tag and __init__.py says $pkg. Make them agree."
            exit 1
          fi
          echo "Tag and version are both $pkg"

      - name: Build the distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
