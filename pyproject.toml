# 実行時の依存はゼロ。tomllib は 3.11 で標準ライブラリに入ったので、
# それ以降なら追加インストール無しで動く。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "publish-guard"
dynamic = ["version"]
description = "Find what you forgot to remove before publishing a repository — git history included"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Coeng" }]
keywords = ["git", "security", "secrets", "anonymization", "pre-publish", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lon-coeng/publish-guard"
Source = "https://github.com/lon-coeng/publish-guard"
Issues = "https://github.com/lon-coeng/publish-guard/issues"

[project.scripts]
publish-guard = "publish_guard.cli:main"

[tool.hatch.version]
path = "publish_guard/__init__.py"

# 配るのはパッケージ本体だけ。テストと設定例は入れない。
[tool.hatch.build.targets.wheel]
packages = ["publish_guard"]

[tool.hatch.build.targets.sdist]
include = [
  "publish_guard",
  "README.md",
  "README.ja.md",
  "LICENSE",
  "examples",
]
